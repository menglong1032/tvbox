<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>影视数据测试台｜猫眼 × 灯塔 × 淘票票</title>
<style>
:root{--bg:#0b0d12;--panel:#121722;--panel2:#171d2a;--line:#252c3b;--text:#f4f6fb;--muted:#8f98aa;--good:#42d392;--warn:#f7b955;--bad:#ff6b6b;--blue:#70a1ff;--violet:#a78bfa;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#172036 0,transparent 32%),var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.app{max-width:1500px;margin:auto;padding:22px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#7c3aed,#2563eb 55%,#0ea5e9);box-shadow:0 10px 30px #2563eb33}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.snapshot{color:var(--muted);font-size:12px;border:1px solid var(--line);padding:8px 10px;border-radius:999px;background:#0f131c}.searchbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:16px}.searchbar input{width:100%;height:48px;border:1px solid var(--line);background:#10151f;color:white;border-radius:14px;padding:0 16px;outline:none;font-size:15px}.searchbar button{border:0;border-radius:14px;padding:0 20px;background:#fff;color:#111;font-weight:700;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);background:#0f141d;color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer}.tab.active{background:#fff;color:#111;border-color:#fff}.grid{display:grid;grid-template-columns:320px 1fr;gap:16px}.side,.main{display:flex;flex-direction:column;gap:16px}.card{background:linear-gradient(180deg,#141a25,#10151e);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 18px 50px #0003}.card h2,.card h3{margin:0 0 12px}.sources{display:grid;gap:10px}.source{display:grid;grid-template-columns:1fr auto;gap:5px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#0f141d}.source strong{font-size:15px}.source small{color:var(--muted)}.pill{align-self:start;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#183125;color:#65d6a3}.pill.demo{background:#322817;color:#f4c86c}.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-top:7px}.toggle input{accent-color:#7c3aed}.movie-list{display:grid;gap:8px}.movie-item{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid transparent;cursor:pointer}.movie-item:hover,.movie-item.active{background:#181f2c;border-color:#2b3446}.movie-item span:last-child{color:var(--muted)}.hero{display:grid;grid-template-columns:180px 1fr;gap:18px}.poster{height:250px;border-radius:16px;background:linear-gradient(160deg,#29334b,#151a25 45%,#7c2d12);position:relative;overflow:hidden;border:1px solid #30384a}.poster:after{content:"DATA LAB";position:absolute;left:14px;bottom:14px;font-size:11px;letter-spacing:2px;color:#ffffff88}.title{font-size:28px;margin:2px 0 6px}.meta{color:var(--muted);margin-bottom:14px}.tag{display:inline-block;border:1px solid #31394b;border-radius:999px;padding:5px 9px;margin:0 6px 6px 0;color:#cbd2df}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}.metric{padding:13px;border-radius:14px;background:#0d121b;border:1px solid var(--line)}.metric small{display:block;color:var(--muted);margin-bottom:4px}.metric b{font-size:20px}.section-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.compare{width:100%;border-collapse:collapse}.compare th,.compare td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left}.compare th{color:var(--muted);font-size:12px}.best{color:#72e4aa;font-weight:700}.muted{color:var(--muted)}.bars{display:flex;align-items:end;gap:12px;height:180px;padding-top:10px}.bar-wrap{flex:1;text-align:center}.bar{border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#8b5cf6,#3b82f6);min-height:8px}.bar-wrap small{display:block;color:var(--muted);font-size:11px;margin-top:7px}.bar-wrap b{display:block;font-size:11px;margin-top:3px}.status-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.status-box{padding:13px;border-radius:14px;border:1px solid var(--line);background:#0e131c}.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;margin-right:7px}.dot.off{background:var(--bad)}pre{white-space:pre-wrap;word-break:break-word;background:#090c12;border:1px solid var(--line);padding:14px;border-radius:14px;color:#b8c2d6;max-height:310px;overflow:auto}.note{padding:12px 14px;border:1px solid #3b3220;background:#1d180f;color:#dec28a;border-radius:14px}.hidden{display:none!important}@media(max-width:1000px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:130px 1fr}.poster{height:190px}.metrics{grid-template-columns:repeat(2,1fr)}.section-grid{grid-template-columns:1fr}}@media(max-width:640px){.app{padding:12px}.top{align-items:flex-start;flex-direction:column}.hero{grid-template-columns:1fr}.poster{height:200px}.metrics,.status-row{grid-template-columns:1fr}.searchbar{grid-template-columns:1fr}.title{font-size:23px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="logo"></div><div><h1>影视数据测试台</h1><p>猫眼 · 灯塔 · 淘票票 ｜字段融合与源健康可视化</p></div></div>
    <div class="snapshot">第一版：可视化原型 · 真实样本数据 + 接口状态模拟</div>
  </div>
  <div class="searchbar"><input id="search" list="titles" value="哪吒之魔童闹海" placeholder="搜索影片，例如：哪吒之魔童闹海"/><datalist id="titles"><option>哪吒之魔童闹海</option><option>唐探1900</option><option>封神第二部：战火西岐</option></datalist><button onclick="doSearch()">搜索 / 测试</button></div>
  <div class="tabs"><button class="tab active" data-tab="overview">融合总览</button><button class="tab" data-tab="compare">三源对比</button><button class="tab" data-tab="raw">原始数据</button><button class="tab" data-tab="health">源健康</button></div>
  <div class="grid">
    <aside class="side">
      <div class="card"><h3>数据源</h3><div class="sources" id="sources"></div><div class="note" style="margin-top:12px">这里先模拟“接口接入后的体验”。源开关可以手动关闭，用来测试降级与融合逻辑。</div></div>
      <div class="card"><h3>测试样本</h3><div class="movie-list" id="movieList"></div></div>
    </aside>
    <main class="main">
      <section id="overview" class="view"></section>
      <section id="compare" class="view hidden"></section>
      <section id="raw" class="view hidden"></section>
      <section id="health" class="view hidden"></section>
    </main>
  </div>
</div>
<script>
const films={
"哪吒之魔童闹海":{year:2025,type:"动画 / 奇幻 / 喜剧",country:"中国大陆",runtime:"144分钟",release:"2025-01-29",director:"饺子",summary:"天劫之后，哪吒、敖丙的灵魂虽保住了，但肉身面临新的危机。",fused:{boxOffice:"154.46亿",firstDay:"4.87亿",firstWeek:"31.31亿",maoyanScore:"9.8",taopiaopiaoScore:"9.7",douban:"8.5"},daily:[{d:"1/29",v:4.87476},{d:"1/30",v:4.803418},{d:"1/31",v:6.191502}],sources:{maoyan:{status:"online",latency:128,boxOffice:"154.46亿",score:"9.8",heat:"历史影片",schedule:"已下映",fields:18},lighthouse:{status:"online",latency:161,boxOffice:"154.45亿",score:"—",heat:"历史影片",schedule:"已下映",fields:16},taopiaopiao:{status:"online",latency:196,boxOffice:"—",score:"9.7",heat:"—",schedule:"已下映",fields:9}}},
"唐探1900":{year:2025,type:"喜剧 / 悬疑",country:"中国大陆",runtime:"135分钟",release:"2025-01-29",director:"陈思诚 / 戴墨",summary:"1900年的旧金山，一起离奇案件牵出多方势力。",fused:{boxOffice:"35.75亿",firstDay:"—",firstWeek:"—",maoyanScore:"—",taopiaopiaoScore:"—",douban:"—"},daily:[],sources:{maoyan:{status:"online",latency:145,boxOffice:"35.75亿",score:"—",heat:"历史影片",schedule:"已下映",fields:15},lighthouse:{status:"online",latency:177,boxOffice:"35.75亿",score:"—",heat:"历史影片",schedule:"已下映",fields:14},taopiaopiao:{status:"online",latency:221,boxOffice:"—",score:"—",heat:"—",schedule:"已下映",fields:8}}},
"封神第二部：战火西岐":{year:2025,type:"动作 / 战争 / 奇幻",country:"中国大陆",runtime:"144分钟",release:"2025-01-29",director:"乌尔善",summary:"西岐保卫战全面展开，殷商与西岐的命运进入新的阶段。",fused:{boxOffice:"12.25亿",firstDay:"—",firstWeek:"—",maoyanScore:"—",taopiaopiaoScore:"—",douban:"—"},daily:[],sources:{maoyan:{status:"online",latency:139,boxOffice:"12.25亿",score:"—",heat:"历史影片",schedule:"已下映",fields:14},lighthouse:{status:"online",latency:171,boxOffice:"12.25亿",score:"—",heat:"历史影片",schedule:"已下映",fields:13},taopiaopiao:{status:"online",latency:205,boxOffice:"—",score:"—",heat:"—",schedule:"已下映",fields:8}}}
};
const sourceMeta={maoyan:{name:"猫眼专业版",desc:"票房 · 排片 · 热度 · 演职员"},lighthouse:{name:"灯塔专业版",desc:"票房 · 大盘 · 热度 · 趋势"},taopiaopiao:{name:"淘票票",desc:"评分 · 购票侧信息 · 影片资料"}};
let active="哪吒之魔童闹海";let enabled={maoyan:true,lighthouse:true,taopiaopiao:true};
function doSearch(){let q=document.getElementById('search').value.trim();let hit=Object.keys(films).find(x=>x.includes(q)||q.includes(x));if(hit){active=hit;render()}else alert('第一版测试样本里暂时没有这个片名。当前可测：哪吒之魔童闹海、唐探1900、封神第二部：战火西岐');}
function fusedValue(key){const f=films[active];if(key==='boxOffice'){if(enabled.maoyan&&f.sources.maoyan.boxOffice!=='—')return f.sources.maoyan.boxOffice;if(enabled.lighthouse&&f.sources.lighthouse.boxOffice!=='—')return f.sources.lighthouse.boxOffice;return '暂无';}return f.fused[key]||'—';}
function renderSources(){let f=films[active];document.getElementById('sources').innerHTML=Object.entries(sourceMeta).map(([k,m])=>{let s=f.sources[k];return `<div class="source"><div><strong>${m.name}</strong><small>${m.desc}</small><label class="toggle"><input type="checkbox" ${enabled[k]?'checked':''} onchange="enabled['${k}']=this.checked;render()">启用此源</label></div><span class="pill ${enabled[k]?'':'demo'}">${enabled[k]?'可用':'已关闭'}</span><small>${enabled[k]?s.latency+' ms · '+s.fields+' 字段':'模拟故障/停用'}</small></div>`}).join('')}
function renderList(){document.getElementById('movieList').innerHTML=Object.keys(films).map(x=>`<div class="movie-item ${x===active?'active':''}" onclick="active='${x.replace(/'/g,"\\'")}';document.getElementById('search').value=active;render()"><span>${x}</span><span>${films[x].year}</span></div>`).join('')}
function overview(){let f=films[active];let max=Math.max(...f.daily.map(x=>x.v),1);return `<div class="card hero"><div class="poster"></div><div><div class="muted">media_id: demo-${f.year}-${active.length}</div><h2 class="title">${active}</h2><div class="meta">${f.year} · ${f.type} · ${f.country} · ${f.runtime}</div><span class="tag">大陆上映 ${f.release}</span><span class="tag">导演 ${f.director}</span><p class="muted">${f.summary}</p><div class="metrics"><div class="metric"><small>融合累计票房</small><b>${fusedValue('boxOffice')}</b></div><div class="metric"><small>首日票房</small><b>${f.fused.firstDay}</b></div><div class="metric"><small>首周票房</small><b>${f.fused.firstWeek}</b></div><div class="metric"><small>数据源可用</small><b>${Object.values(enabled).filter(Boolean).length}/3</b></div></div></div></div><div class="section-grid"><div class="card"><h3>票房趋势样本</h3>${f.daily.length?`<div class="bars">${f.daily.map(x=>`<div class="bar-wrap"><div class="bar" style="height:${Math.max(12,x.v/max*140)}px"></div><small>${x.d}</small><b>${x.v.toFixed(2)}亿</b></div>`).join('')}</div>`:'<div class="muted">这个样本暂未录入日票房序列。</div>'}</div><div class="card"><h3>评分与平台指标</h3><table class="compare"><tr><th>指标</th><th>值</th></tr><tr><td>猫眼购票评分</td><td>${f.fused.maoyanScore}</td></tr><tr><td>淘票票评分</td><td>${f.fused.taopiaopiaoScore}</td></tr><tr><td>豆瓣评分（辅助）</td><td>${f.fused.douban}</td></tr><tr><td>上映状态</td><td>历史影片</td></tr></table></div></div>`}
function compare(){let f=films[active];return `<div class="card"><h3>三源字段对比</h3><table class="compare"><thead><tr><th>字段</th><th>猫眼</th><th>灯塔</th><th>淘票票</th><th>融合结果</th></tr></thead><tbody><tr><td>累计票房</td><td>${enabled.maoyan?f.sources.maoyan.boxOffice:'OFF'}</td><td>${enabled.lighthouse?f.sources.lighthouse.boxOffice:'OFF'}</td><td>${enabled.taopiaopiao?f.sources.taopiaopiao.boxOffice:'OFF'}</td><td class="best">${fusedValue('boxOffice')}</td></tr><tr><td>购票评分</td><td>${enabled.maoyan?f.sources.maoyan.score:'OFF'}</td><td>${enabled.lighthouse?f.sources.lighthouse.score:'OFF'}</td><td>${enabled.taopiaopiao?f.sources.taopiaopiao.score:'OFF'}</td><td class="best">猫眼/淘票票分别保留</td></tr><tr><td>热度</td><td>${enabled.maoyan?f.sources.maoyan.heat:'OFF'}</td><td>${enabled.lighthouse?f.sources.lighthouse.heat:'OFF'}</td><td>${enabled.taopiaopiao?f.sources.taopiaopiao.heat:'OFF'}</td><td>按平台独立存储</td></tr><tr><td>上映状态</td><td>${f.sources.maoyan.schedule}</td><td>${f.sources.lighthouse.schedule}</td><td>${f.sources.taopiaopiao.schedule}</td><td class="best">已下映</td></tr><tr><td>字段覆盖</td><td>${f.sources.maoyan.fields}</td><td>${f.sources.lighthouse.fields}</td><td>${f.sources.taopiaopiao.fields}</td><td>${Math.max(f.sources.maoyan.fields,f.sources.lighthouse.fields,f.sources.taopiaopiao.fields)}+</td></tr></tbody></table></div><div class="card"><h3>融合策略演示</h3><p class="muted">票房：猫眼优先 → 灯塔兜底。评分不强行融合：猫眼评分和淘票票评分分别保存。平台热度也不混成同一个数字，避免把不同口径伪装成同一指标。</p><div class="note">试着在左侧关闭“猫眼”，融合累计票房会自动切换到灯塔；再关闭灯塔，结果显示暂无。</div></div>`}
function raw(){let f=films[active];let payload={media_id:'demo-'+f.year+'-'+active.length,title:active,year:f.year,type:'movie',fused:{box_office:fusedValue('boxOffice'),release_date:f.release},sources:Object.fromEntries(Object.entries(f.sources).map(([k,v])=>[k,{enabled:enabled[k],...v}]))};return `<div class="card"><h3>统一 API 预览</h3><p class="muted">这就是以后前端真正应该拿到的结构：前端不关心猫眼/灯塔怎么抓，只拿统一结果和 source_trace。</p><pre>${JSON.stringify(payload,null,2)}</pre></div>`}
function health(){let f=films[active];return `<div class="card"><h3>Provider 健康状态</h3><div class="status-row">${Object.entries(sourceMeta).map(([k,m])=>{let s=f.sources[k],on=enabled[k];return `<div class="status-box"><div><span class="dot ${on?'':'off'}"></span><b>${m.name}</b></div><div class="muted" style="margin-top:8px">status: ${on?'ACTIVE':'PAUSED'}</div><div class="muted">latency: ${on?s.latency+' ms':'—'}</div><div class="muted">fields: ${s.fields}</div><div class="muted">last_success: ${on?'just now':'—'}</div></div>`}).join('')}</div></div><div class="card"><h3>后续真实接入时建议记录</h3><table class="compare"><tr><th>字段</th><th>用途</th></tr><tr><td>success_rate</td><td>自动降级和优先级排序</td></tr><tr><td>consecutive_failures</td><td>连续失败后暂停 Provider</td></tr><tr><td>last_success</td><td>判断数据是否过期</td></tr><tr><td>updated_at</td><td>票房 / 热度时效性</td></tr><tr><td>source_url</td><td>追溯原始来源</td></tr></table></div>`}
function render(){renderSources();renderList();document.getElementById('overview').innerHTML=overview();document.getElementById('compare').innerHTML=compare();document.getElementById('raw').innerHTML=raw();document.getElementById('health').innerHTML=health();}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden')});render();
</script>
</body></html>
