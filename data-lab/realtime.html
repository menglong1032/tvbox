<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>影视数据实验室</title>
<style>
:root{--bg:#080a0f;--panel:#10141d;--panel2:#151a25;--line:#242b39;--text:#f6f7fb;--muted:#8f9aae;--good:#43d39e;--warn:#ffbd59;--bad:#ff6b78;--accent:#8b7cff;--accent2:#54a9ff;--r:20px}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font:14px/1.6 Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(900px 500px at 12% -10%,#24315655,transparent 55%),var(--bg)}
button,input{font:inherit}.shell{max-width:1540px;margin:auto;padding:20px}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:11px}.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#9b8cff,#4a93ff);box-shadow:0 8px 30px #6b74ff44}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);margin-top:-2px}.provider{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#0d1118cc;padding:7px 11px;border-radius:999px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}.dot.ok{background:var(--good);box-shadow:0 0 0 5px #43d39e12}.dot.bad{background:var(--bad)}
.searchbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px;border:1px solid var(--line);background:#0e1219cc;border-radius:17px;backdrop-filter:blur(18px);position:sticky;top:10px;z-index:20}.searchbar input{height:46px;border:0;outline:0;background:transparent;color:white;padding:0 12px;font-size:15px}.searchbar button{height:46px;border:0;border-radius:12px;padding:0 20px;color:#0b0d12;background:#fff;font-weight:800;cursor:pointer}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;margin-top:16px}.side{display:flex;flex-direction:column;gap:12px}.panel{border:1px solid var(--line);background:linear-gradient(180deg,#121722ee,#0d1118ee);border-radius:var(--r);overflow:hidden}.panel-h{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 10px}.panel-h b{font-size:13px}.panel-h span{color:var(--muted);font-size:12px}.results{padding:0 9px 10px;display:grid;gap:7px}.result{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;padding:8px;border:1px solid transparent;border-radius:13px;cursor:pointer;transition:.18s}.result:hover,.result.active{background:#181f2b;border-color:#2c3648}.thumb{width:46px;height:64px;border-radius:8px;object-fit:cover;background:#0a0d12}.result b{font-size:13px;display:block;line-height:1.35}.result small{display:block;color:var(--muted);margin-top:4px;line-height:1.35}.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.debug{padding:0 14px 14px}.debug summary{cursor:pointer;color:var(--muted);font-size:12px}.debug pre{white-space:pre-wrap;word-break:break-word;background:#090c11;border:1px solid var(--line);padding:12px;border-radius:12px;max-height:280px;overflow:auto;font:11px/1.55 ui-monospace,Consolas,monospace;color:#aab5c8}
.main{min-width:0}.hero{position:relative;min-height:410px;border:1px solid var(--line);border-radius:26px;overflow:hidden;background:#10151d}.hero-bg{position:absolute;inset:-40px;background-size:cover;background-position:center 22%;filter:blur(24px) saturate(.8);opacity:.28;transform:scale(1.08)}.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,#090c12 0%,#0a0d13ee 35%,#0a0d13a5 68%,#0a0d13dd 100%),linear-gradient(0deg,#090c12 0%,transparent 55%)}.hero-inner{position:relative;display:grid;grid-template-columns:240px 1fr;gap:28px;padding:30px;min-height:410px;align-items:end}.poster-wrap{position:relative}.poster{width:100%;aspect-ratio:2/3;border-radius:18px;object-fit:cover;background:#10151d;box-shadow:0 22px 60px #0009;border:1px solid #ffffff1a}.hd{position:absolute;left:12px;bottom:12px;background:#090c12cc;border:1px solid #ffffff25;border-radius:999px;padding:5px 8px;font-size:11px;color:#dfe6f3}.eyebrow{color:#9da9bd;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.title{font-size:38px;line-height:1.1;margin:6px 0 6px;letter-spacing:-.03em}.en{color:#9ba7b9;font-size:14px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.chip{padding:6px 9px;border-radius:999px;background:#ffffff0d;border:1px solid #ffffff17;color:#d7deea;font-size:12px}.synopsis{max-width:780px;color:#ccd3df;line-height:1.8}.metrics{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:10px;max-width:790px;margin-top:18px}.metric{padding:12px 13px;border-radius:14px;background:#0c1119aa;border:1px solid #ffffff13;backdrop-filter:blur(12px)}.metric small{display:block;color:#8d99ac}.metric strong{font-size:20px;display:block;margin-top:2px}.metric em{font-style:normal;font-size:11px;color:#6f7c91}
.section{margin-top:16px;border:1px solid var(--line);background:linear-gradient(180deg,#111620,#0c1017);border-radius:22px;padding:18px}.section-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:13px}.section-title h2{font-size:17px;margin:0}.section-title span{font-size:12px;color:var(--muted)}.featured{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:16px}.trailer-hero{position:relative;min-height:330px;border-radius:18px;overflow:hidden;background:#090c11;border:1px solid var(--line)}.trailer-hero img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;opacity:.72}.trailer-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#07090d 0%,transparent 65%)}.play{position:absolute;z-index:2;left:24px;top:24px;width:56px;height:56px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:23px;text-decoration:none;box-shadow:0 12px 30px #0007}.trailer-copy{position:absolute;z-index:2;left:22px;right:22px;bottom:20px}.trailer-copy b{font-size:18px;display:block}.trailer-copy small{color:#b1bccd}.trailer-list{display:grid;gap:8px;align-content:start}.trailer-row{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px;border:1px solid var(--line);border-radius:13px;background:#0c1118}.trailer-row img{width:104px;aspect-ratio:16/9;border-radius:9px;object-fit:cover;background:#131925}.trailer-row b{font-size:12px;line-height:1.45;display:block}.trailer-row small{color:var(--muted);display:block;margin-top:4px}.trailer-row a{color:#adc8ff;text-decoration:none;font-size:11px}.official-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.video-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0b1017}.video-card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#151a23}.video-card .body{padding:10px}.video-card b{font-size:12px;line-height:1.45;display:block}.video-card small{color:var(--muted)}
.cast{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.person{background:#0b1017;border:1px solid var(--line);border-radius:15px;padding:10px;text-align:center}.avatar{width:74px;height:74px;border-radius:50%;object-fit:cover;background:#19202b;border:1px solid #ffffff18}.avatar-fallback{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;margin:auto;background:linear-gradient(135deg,#283147,#171d29);font-size:22px}.person b{display:block;margin-top:8px}.person small{color:var(--muted)}
.media-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.asset{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0c1118}.asset img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#151a23}.asset span{display:block;padding:8px 9px;color:var(--muted);font-size:11px}.kv{display:grid;grid-template-columns:180px 1fr;border-top:1px solid var(--line)}.kv div{padding:9px 8px;border-bottom:1px solid var(--line);word-break:break-word}.kv div:nth-child(odd){color:var(--muted)}details.more summary{cursor:pointer;font-weight:700}.source-note{margin-top:12px;padding:10px 12px;border:1px solid #3c3321;background:#1b170e;border-radius:12px;color:#dfc184;font-size:12px}
@media(max-width:1100px){.featured{grid-template-columns:1fr}.official-grid{grid-template-columns:repeat(2,1fr)}.cast{grid-template-columns:repeat(4,1fr)}.media-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{order:2}.hero-inner{grid-template-columns:170px 1fr;padding:22px}.title{font-size:30px}.metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.shell{padding:10px}.topbar{height:auto;align-items:flex-start}.provider{font-size:11px}.hero-inner{grid-template-columns:1fr;align-items:start}.poster-wrap{width:165px}.title{font-size:28px}.metrics{grid-template-columns:repeat(2,1fr)}.official-grid{grid-template-columns:1fr 1fr}.cast{grid-template-columns:repeat(3,1fr)}.media-grid{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:1fr}.kv div:nth-child(odd){padding-bottom:0;border-bottom:0}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><div class="mark"></div><div><b>影视数据实验室</b><small>实时 Provider · 媒体资产 · 字段溯源</small></div></div>
    <div class="provider"><span id="statusDot" class="dot"></span><span id="statusText">检测猫眼 Provider…</span></div>
  </div>
  <div class="searchbar"><input id="q" value="哪吒之魔童闹海" placeholder="搜索电影，例如：星际穿越"><button onclick="searchMovie()">实时搜索</button></div>
  <div class="layout">
    <aside class="side">
      <div class="panel"><div class="panel-h"><b>搜索结果</b><span id="searchMeta">—</span></div><div id="results" class="results"><div class="empty">输入片名开始测试</div></div></div>
      <div class="panel"><div class="panel-h"><b>Provider</b><span>调试信息</span></div><div class="debug"><details><summary>展开原始响应</summary><pre id="debug">等待请求…</pre></details></div></div>
    </aside>
    <main id="detail" class="main"><div class="panel empty">搜索并选择一部影片，这里会显示高清海报、真实预告、人物头像和完整字段。</div></main>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lastLog={};let activeId='';
function log(key,obj){lastLog[key]=obj;$('#debug').textContent=JSON.stringify(lastLog,null,2)}
async function api(params,key='api'){const u='/api/maoyan?'+new URLSearchParams(params);const t=performance.now();const r=await fetch(u);let data;try{data=await r.json()}catch{throw new Error('接口返回不是 JSON')}data._client_ms=Math.round(performance.now()-t);log(key,data);if(!r.ok||!data.ok)throw new Error(data.error||('HTTP '+r.status));return data}
async function check(){try{const d=await api({action:'status'},'status');$('#statusDot').className='dot ok';$('#statusText').textContent='猫眼实时 · ACTIVE'}catch(e){$('#statusDot').className='dot bad';$('#statusText').textContent='Provider 不可用'}}
function resultCard(m){return `<div class="result ${activeId===String(m.id)?'active':''}" onclick="loadMovie('${esc(m.id)}')"><img class="thumb" src="${esc(m.poster||'')}" loading="lazy"><div><b>${esc(m.name)}</b><small>${esc([m.release_date,m.category,m.score!=null?'猫眼 '+m.score:''].filter(Boolean).join(' · '))}</small></div></div>`}
async function searchMovie(){const q=$('#q').value.trim();if(!q)return;$('#results').innerHTML='<div class="empty">正在实时搜索…</div>';$('#searchMeta').textContent='请求中';try{const d=await api({action:'search',q},'search');$('#searchMeta').textContent=`${d.count} 条 · ${d.latency_ms}ms`;$('#results').innerHTML=d.movies.length?d.movies.map(resultCard).join(''):'<div class="empty">没有找到匹配影片</div>';if(d.movies[0])loadMovie(d.movies[0].id)}catch(e){$('#results').innerHTML='<div class="empty">搜索失败：'+esc(e.message)+'</div>';$('#searchMeta').textContent='失败'}}
function field(label,value){return `<div>${esc(label)}</div><div>${value===null||value===undefined||value===''?'<span style="color:var(--muted)">—</span>':esc(value)}</div>`}
function niceNum(n){if(n===null||n===undefined||n==='')return '—';const x=Number(n);if(Number.isNaN(x))return n;if(x>=100000000)return (x/100000000).toFixed(2)+'亿';if(x>=10000)return (x/10000).toFixed(1)+'万';return x.toLocaleString('zh-CN')}
function mediaFallback(m){return m.poster_hd||m.poster||''}
function trailerCard(v,m,featured=false){const cover=v.cover||mediaFallback(m);const title=v.title||('猫眼预告片 · '+v.video_id);if(featured)return `<div class="trailer-hero"><img src="${esc(cover)}"><a class="play" href="${esc(v.source_page_url)}" target="_blank" rel="noreferrer">▶</a><div class="trailer-copy"><b>${esc(title)}</b><small>${esc([v.duration,v.play_count?'播放 '+v.play_count:'','猫眼官方预告页'].filter(Boolean).join(' · '))}</small></div></div>`;return `<div class="trailer-row"><img src="${esc(cover)}" loading="lazy"><div><b>${esc(title)}</b><small>${esc([v.duration,v.play_count].filter(Boolean).join(' · '))}</small><a href="${esc(v.source_page_url)}" target="_blank" rel="noreferrer">打开官方预告 →</a></div></div>`}
function officialCard(v,m){return `<div class="video-card"><img src="${esc(v.cover||mediaFallback(m))}" loading="lazy"><div class="body"><b>${esc(v.title||('官方视频 '+v.video_id))}</b><small>${esc([v.duration,v.play_count].filter(Boolean).join(' · '))}</small></div></div>`}
async function loadMovie(id){activeId=String(id);document.querySelectorAll('.result').forEach(x=>x.classList.remove('active'));$('#detail').innerHTML='<div class="panel empty">正在读取高清详情、预告和人物资料…</div>';try{
 const [d,v]=await Promise.all([api({action:'detail',id},'detail'),api({action:'videos',id},'videos').catch(e=>({ok:false,error:e.message,videos:[],trailer_count:0,official_count:0}))]);
 const m=d.movie||{}; const actorIds=(m.actors||[]).map(a=>a.id).filter(Boolean).slice(0,8); let people=[];
 if(actorIds.length){try{const p=await api({action:'people',ids:actorIds.join(',')},'people');people=p.people||[]}catch(e){}}
 const peopleMap=new Map(people.map(p=>[String(p.id),p]));
 const trailers=(v.videos||[]).filter(x=>x.type==='trailer'); const officials=(v.videos||[]).filter(x=>x.type!=='trailer');
 const lead=trailers[0]||null; const bx=m.box_office||{};
 const cast=(m.actors||[]).map(a=>{const p=peopleMap.get(String(a.id))||{};const name=a.name||p.name||'未知';return `<div class="person">${p.avatar?`<img class="avatar" src="${esc(p.avatar)}" loading="lazy">`:`<div class="avatar-fallback">${esc(name.slice(0,1))}</div>`}<b>${esc(name)}</b><small>person_id ${esc(a.id)}</small></div>`}).join('')||'<div class="empty">当前未解析到人物</div>';
 const trailerList=trailers.slice(1,5).map(x=>trailerCard(x,m,false)).join('');
 const officialGrid=officials.slice(0,8).map(x=>officialCard(x,m)).join('');
 const mediaAssets=[{label:'高清海报',url:m.poster_hd||m.poster},...trailers.filter(x=>x.cover).slice(0,4).map((x,i)=>({label:'预告封面 '+(i+1),url:x.cover}))].filter(x=>x.url);
 $('#detail').innerHTML=`
 <section class="hero"><div class="hero-bg" style="background-image:url('${esc(m.poster_hd||m.poster||'')}')"></div><div class="hero-shade"></div><div class="hero-inner"><div class="poster-wrap"><img class="poster" src="${esc(m.poster_hd||m.poster||'')}"><span class="hd">HD 原图</span></div><div><div class="eyebrow">MAOYAN · REALTIME</div><h1 class="title">${esc(m.name||('猫眼 '+id))}</h1><div class="en">${esc(m.english_name||'')}</div><div class="chips">${[m.category,m.show_time,m.duration_min?m.duration_min+'分钟':''].filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><p class="synopsis">${esc(m.description||'暂无简介')}</p><div class="metrics"><div class="metric"><small>猫眼评分</small><strong>${esc(m.score??'—')}</strong><em>购票评分</em></div><div class="metric"><small>评分人数</small><strong>${esc(niceNum(m.score_count))}</strong><em>实时页面解析</em></div><div class="metric"><small>累计票房</small><strong>${esc(bx['累计票房']?.display||bx['总票房']?.display||'—')}</strong><em>${m.error?'扩展源受限':'猫眼扩展页'}</em></div><div class="metric"><small>预告片</small><strong>${esc(v.trailer_count??trailers.length)}</strong><em>${esc(v.official_count??officials.length)} 条官方视频</em></div></div></div></div></section>
 <section class="section"><div class="section-title"><h2>官方预告</h2><span>只展示识别为“预告片”的内容，不再混入普通官方视频</span></div>${lead?`<div class="featured">${trailerCard(lead,m,true)}<div class="trailer-list">${trailerList||'<div class="empty">暂无更多预告</div>'}</div></div>`:'<div class="empty">猫眼页面暂未解析到预告片；不会用普通视频冒充预告。</div>'}<div class="source-note">当前若没有公开直链播放器，就跳转猫眼官方预告页；只有采集到明确可播放的媒体 URL 时，后续才会在这里直接内嵌播放。</div></section>
 <section class="section"><div class="section-title"><h2>演职员</h2><span>人物头像来自猫眼公开人物页</span></div><div class="cast">${cast}</div></section>
 <section class="section"><div class="section-title"><h2>媒体资产</h2><span>原图优先，不使用移动端缩略图</span></div><div class="media-grid">${mediaAssets.map(a=>`<div class="asset"><a href="${esc(a.url)}" target="_blank" rel="noreferrer"><img src="${esc(a.url)}" loading="lazy"></a><span>${esc(a.label)}</span></div>`).join('')||'<div class="empty">暂无媒体资产</div>'}</div></section>
 ${officialGrid?`<section class="section"><div class="section-title"><h2>其他官方视频</h2><span>与预告片分开展示</span></div><div class="official-grid">${officialGrid}</div></section>`:''}
 <section class="section"><details class="more"><summary>完整字段 / 来源 / 调试信息</summary><div class="kv" style="margin-top:14px">${field('movie_id',m.id)}${field('片名',m.name)}${field('英文名',m.english_name)}${field('类型',m.category)}${field('上映信息',m.show_time)}${field('时长',m.duration_min)}${field('评分',m.score)}${field('评分人数',m.score_count)}${field('高清海报 URL',m.poster_hd||m.poster)}${field('详情来源',m.source_url)}${field('出品发行',m.publisher)}${field('技术参数',m.tech_param)}${field('幕后花絮',m.behind_the_scenes)}${field('抓取时间',d.fetched_at)}${field('服务端耗时',d.latency_ms+' ms')}</div></details></section>`;
 }catch(e){$('#detail').innerHTML='<div class="panel empty">详情读取失败：'+esc(e.message)+'</div>'}}
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')searchMovie()});check();searchMovie();
</script>
</body></html>
