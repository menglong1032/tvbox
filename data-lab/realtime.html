<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>影视数据实时测试台</title>
<style>
:root{--bg:#0b0d12;--panel:#121722;--line:#252c3b;--text:#f4f6fb;--muted:#94a0b8;--good:#42d392;--bad:#ff6b6b;--warn:#f7b955}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#17203b,transparent 28%),var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1380px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.top h1{font-size:22px;margin:0}.muted{color:var(--muted)}.badge{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#111722}.search{display:grid;grid-template-columns:1fr auto;gap:10px}.search input{height:50px;border-radius:14px;border:1px solid var(--line);background:#0f141d;color:#fff;padding:0 15px;font-size:16px}.search button,.btn{border:0;border-radius:12px;background:#fff;color:#111;font-weight:700;padding:0 18px;cursor:pointer}.grid{display:grid;grid-template-columns:310px 1fr;gap:16px;margin-top:16px}.card{border:1px solid var(--line);background:linear-gradient(180deg,#141a25,#10151e);border-radius:18px;padding:16px}.status{display:flex;justify-content:space-between;gap:10px;align-items:center}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--warn)}.dot.ok{background:var(--good)}.dot.bad{background:var(--bad)}.results{display:grid;gap:8px;margin-top:12px}.item{padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:#0d121b}.item:hover{border-color:#42506a}.item b{display:block}.hero{display:grid;grid-template-columns:190px 1fr;gap:18px}.poster{width:100%;height:270px;border-radius:14px;object-fit:cover;background:#0d1118;border:1px solid var(--line)}.title{font-size:28px;margin:0 0 4px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid #31394b;border-radius:999px;padding:5px 9px;color:#cbd2df}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}.metric{padding:12px;border:1px solid var(--line);border-radius:13px;background:#0c1119}.metric small{display:block;color:var(--muted)}.metric b{font-size:18px}.section{margin-top:16px}.section h3{margin:0 0 10px}.kv{display:grid;grid-template-columns:170px 1fr;border-top:1px solid var(--line)}.kv div{padding:9px 8px;border-bottom:1px solid var(--line)}.kv div:nth-child(odd){color:var(--muted)}.actors{display:flex;gap:9px;flex-wrap:wrap}.actor{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#0d121b}.videos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.video{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#0d121b}.video img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#111}.video .p{padding:10px}.video a{color:#9ec1ff;text-decoration:none}.log{font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;background:#090c12;border:1px solid var(--line);padding:12px;border-radius:12px;max-height:340px;overflow:auto}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:130px 1fr}.poster{height:190px}.metrics{grid-template-columns:repeat(2,1fr)}.videos{grid-template-columns:1fr}}@media(max-width:560px){.wrap{padding:12px}.top{align-items:flex-start;flex-direction:column}.hero{grid-template-columns:1fr}.poster{height:260px}.metrics{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv div:nth-child(odd){padding-bottom:0;border-bottom:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>影视数据实时测试台</h1><div class="muted">第一阶段：猫眼实时 Provider · 灯塔 / 淘票票待接入</div></div><div class="badge"><span id="statusDot" class="dot"></span><span id="statusText">检测 Provider…</span></div></div>
  <div class="search"><input id="q" value="哪吒之魔童闹海" placeholder="输入电影名，例如：星际穿越"><button onclick="searchMovie()">实时搜索</button></div>
  <div class="grid">
    <div>
      <div class="card"><div class="status"><b>搜索结果</b><span id="searchMeta" class="muted">—</span></div><div id="results" class="results"><div class="empty">输入片名开始实时测试</div></div></div>
      <div class="card" style="margin-top:16px"><b>Provider 调试</b><div id="debug" class="log" style="margin-top:10px">等待请求…</div></div>
    </div>
    <div id="detail"><div class="card empty">选择一部影片后，这里会显示猫眼实时返回的字段、图片、票房、人物与视频。</div></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function log(obj){$('#debug').textContent=typeof obj==='string'?obj:JSON.stringify(obj,null,2)}
async function api(params){const u='/api/maoyan?'+new URLSearchParams(params);const t=performance.now();const r=await fetch(u);const data=await r.json();data._client_ms=Math.round(performance.now()-t);log(data);if(!r.ok||!data.ok)throw new Error(data.error||('HTTP '+r.status));return data}
async function check(){try{const d=await api({action:'status'});$('#statusDot').className='dot ok';$('#statusText').textContent='猫眼 Provider ACTIVE'}catch(e){$('#statusDot').className='dot bad';$('#statusText').textContent='Provider 不可用';log(e.message)}}
async function searchMovie(){const q=$('#q').value.trim();if(!q)return;$('#results').innerHTML='<div class="empty">实时搜索中…</div>';$('#searchMeta').textContent='请求中';try{const d=await api({action:'search',q});$('#searchMeta').textContent=`${d.count} 条 · ${d.latency_ms}ms`;$('#results').innerHTML=d.movies.length?d.movies.map(m=>`<div class="item" onclick="loadMovie('${esc(m.id)}')"><b>${esc(m.name)}</b><span class="muted">${esc([m.release_date,m.category,m.score!=null?'评分 '+m.score:''].filter(Boolean).join(' · '))}</span></div>`).join(''):'<div class="empty">猫眼没有返回匹配影片</div>'}catch(e){$('#results').innerHTML='<div class="empty">搜索失败：'+esc(e.message)+'</div>';$('#searchMeta').textContent='失败'}}
function field(label,value){return `<div>${esc(label)}</div><div>${value===null||value===undefined||value===''?'<span class="muted">—</span>':esc(value)}</div>`}
async function loadMovie(id){$('#detail').innerHTML='<div class="card empty">正在实时读取详情、票房和视频…</div>';try{const [d,v]=await Promise.all([api({action:'detail',id}),api({action:'videos',id}).catch(e=>({ok:false,error:e.message,videos:[]}))]);const m=d.movie||{};const bx=m.box_office||{};const actors=(m.actors||[]).map(a=>`<div class="actor"><b>${esc(a.name)}</b><div class="muted">person_id ${esc(a.id)}</div></div>`).join('')||'<span class="muted">当前页面未解析到人物</span>';const vids=(v.videos||[]).slice(0,18).map(x=>`<div class="video">${x.cover?`<img src="${esc(x.cover)}" loading="lazy">`:'<div style="aspect-ratio:16/9;background:#10151e"></div>'}<div class="p"><b>${esc(x.title||('视频 '+x.video_id))}</b><div class="muted">${esc(x.duration||'')} · videoId ${esc(x.video_id)}</div><a href="${esc(x.source_page_url)}" target="_blank" rel="noreferrer">打开猫眼视频页</a></div></div>`).join('')||'<div class="muted">当前未解析到视频列表</div>';$('#detail').innerHTML=`<div class="card"><div class="hero"><img class="poster" src="${esc(m.poster||'')}" onerror="this.style.visibility='hidden'"><div><h2 class="title">${esc(m.name||('猫眼 '+id))}</h2><div class="muted">${esc(m.english_name||'')}</div><div class="chips">${[m.category,m.show_time,m.duration_min?m.duration_min+'分钟':''].filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="metrics"><div class="metric"><small>猫眼评分</small><b>${esc(m.score??'—')}</b></div><div class="metric"><small>评分人数</small><b>${esc(m.score_count??'—')}</b></div><div class="metric"><small>累计票房</small><b>${esc(bx['累计票房']?.display||bx['总票房']?.display||'—')}</b></div><div class="metric"><small>首周票房</small><b>${esc(bx['首周票房']?.display||'—')}</b></div></div><p>${esc(m.description||'')}</p></div></div></div><div class="card section"><h3>完整字段 · 猫眼实时</h3><div class="kv">${field('movie_id',m.id)}${field('片名',m.name)}${field('英文名',m.english_name)}${field('类型',m.category)}${field('上映信息',m.show_time)}${field('时长',m.duration_min)}${field('评分',m.score)}${field('评分人数',m.score_count)}${field('海报 URL',m.poster)}${field('详情来源',m.source_url)}${field('出品发行',m.publisher)}${field('技术参数',m.tech_param)}${field('幕后花絮',m.behind_the_scenes)}${field('抓取时间',d.fetched_at)}${field('服务端耗时',d.latency_ms+' ms')}</div></div><div class="card section"><h3>演职员 / 人物</h3><div class="actors">${actors}</div></div><div class="card section"><h3>视频资产 <span class="muted">${v.count??0} 条</span></h3><div class="videos">${vids}</div></div><div class="card section"><h3>原始 Provider JSON</h3><div class="log">${esc(JSON.stringify({detail:d,videos:v},null,2))}</div></div>`}catch(e){$('#detail').innerHTML='<div class="card empty">详情读取失败：'+esc(e.message)+'</div>'}}
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')searchMovie()});check();
</script>
</body></html>
