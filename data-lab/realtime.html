<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>影视数据实验室</title>
<style>
:root{--bg:#07090d;--panel:#0d1219;--panel2:#111823;--line:#222c3b;--line2:#334056;--text:#f7f8fb;--muted:#929db0;--muted2:#667287;--good:#41d39f;--accent:#7c88ff;--warn:#d8ac54;--r:20px}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font:14px/1.65 Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(900px 420px at 14% -8%,#25386a40,transparent 62%),var(--bg)}button,input{font:inherit}.app{max-width:1480px;margin:auto;padding:22px 28px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#a08cff,#4e8fff);box-shadow:0 12px 36px #6573ff3d}.brand b{display:block;font-size:18px}.brand span{display:block;margin-top:1px;color:var(--muted);font-size:12px}.live{display:flex;align-items:center;gap:8px;border:1px solid #214d42;border-radius:999px;background:#0c1515;padding:7px 11px;color:#bde9da;font-size:12px}.live i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px #41d39f16}.search{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px;border:1px solid var(--line);border-radius:17px;background:#0d1219;position:sticky;top:8px;z-index:20;box-shadow:0 10px 35px #0005}.search input{height:50px;border:0;outline:0;background:transparent;color:#fff;padding:0 14px;font-size:16px}.search button{height:50px;border:0;border-radius:13px;padding:0 24px;background:#fff;color:#090b0e;font-weight:800;cursor:pointer}.search button:disabled{opacity:.55;cursor:wait}.resultHead{display:flex;justify-content:space-between;align-items:center;margin:15px 2px 9px}.resultHead b{font-size:13px}.resultHead span{color:var(--muted);font-size:12px}.candidates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}.candidate{display:grid;grid-template-columns:58px minmax(0,1fr);gap:11px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:15px;background:#0b1017;cursor:pointer;transition:.16s}.candidate:hover{border-color:#3c4b62;background:#101721}.candidate.active{border-color:#5d6fa3;background:linear-gradient(135deg,#151e2e,#0e141d)}.cposter{width:58px;height:78px;border-radius:9px;overflow:hidden;position:relative;background:linear-gradient(145deg,#1c2532,#0c1117)}.cposter:after{content:"无图";position:absolute;inset:0;display:grid;place-items:center;color:#5c687a;font-size:10px}.cposter img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}.candidate b{display:block;font-size:14px;line-height:1.35}.candidate small{display:block;margin-top:4px;color:var(--muted);line-height:1.45}.exact{display:inline-block;margin-top:5px;padding:2px 7px;border-radius:999px;background:#26344d;color:#bed0ff;font-size:10px}.hero{position:relative;overflow:hidden;min-height:500px;border:1px solid var(--line);border-radius:28px;background:#0b1016}.heroBg{position:absolute;inset:-46px;background-size:cover;background-position:center 28%;filter:blur(38px) saturate(.8);opacity:.25;transform:scale(1.1)}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#080b0f 0,#090d13f4 35%,#090d13bd 68%,#090d13ef 100%),linear-gradient(0deg,#080a0e 0,transparent 48%)}.heroIn{position:relative;min-height:500px;padding:32px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:34px;align-items:end}.poster{aspect-ratio:2/3;border:1px solid #ffffff16;border-radius:18px;overflow:hidden;position:relative;background:linear-gradient(145deg,#1c2634,#0d1218);box-shadow:0 22px 70px #000a}.poster:after{content:"暂无海报";position:absolute;inset:0;display:grid;place-items:center;color:#68758a;font-size:12px}.poster img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}.quality{position:absolute;left:12px;bottom:12px;z-index:3;padding:5px 8px;border:1px solid #ffffff22;border-radius:999px;background:#080b10d8;font-size:11px}.source{font-size:11px;letter-spacing:.13em;color:#93a4bd}.title{margin:7px 0 3px;font-size:42px;line-height:1.08;letter-spacing:-.035em}.en{color:#98a4b7}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}.chip{padding:6px 9px;border:1px solid #ffffff18;border-radius:999px;background:#ffffff0b;color:#d8dfeb;font-size:12px}.desc{max-width:900px;margin:12px 0 0;color:#ccd4df;line-height:1.9}.metrics{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.metric{min-width:145px;padding:12px 14px;border:1px solid #ffffff12;border-radius:14px;background:#090d13b5}.metric small{display:block;color:#8190a4}.metric strong{display:block;margin-top:1px;font-size:20px}.metric em{display:block;margin-top:1px;color:#647086;font-size:10px;font-style:normal}.section{margin-top:16px;padding:20px;border:1px solid var(--line);border-radius:23px;background:linear-gradient(180deg,#101620,#0b1017)}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:14px}.sectionHead h2{margin:0;font-size:18px}.sectionHead span{color:var(--muted);font-size:12px}.trailers{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,.8fr);gap:16px}.player{aspect-ratio:16/9;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#000}.player video{width:100%;height:100%;display:block;background:#000}.playerInfo{display:flex;justify-content:space-between;gap:12px;margin-top:10px}.playerInfo b{font-size:14px}.playerInfo span{color:var(--muted);font-size:12px}.playlist{display:grid;gap:8px;align-content:start}.trailer{display:grid;grid-template-columns:116px 1fr;gap:10px;padding:8px;border:1px solid var(--line);border-radius:13px;background:#0b1017;cursor:pointer}.trailer:hover,.trailer.active{border-color:#4d5e78;background:#121a25}.cover{width:116px;aspect-ratio:16/9;border-radius:9px;overflow:hidden;position:relative;background:linear-gradient(145deg,#1a2431,#0d1218)}.cover:after{content:"预告";position:absolute;inset:0;display:grid;place-items:center;color:#647187;font-size:10px}.cover img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}.trailer b{display:block;font-size:12px;line-height:1.45}.trailer small{display:block;margin-top:4px;color:var(--muted);font-size:11px}.cast{display:flex;gap:10px;overflow:auto;padding-bottom:4px}.person{flex:0 0 145px;padding:14px 10px;border:1px solid var(--line);border-radius:15px;background:#0b1017;text-align:center}.avatar{width:78px;height:78px;margin:auto;border-radius:50%;overflow:hidden;position:relative;background:linear-gradient(145deg,#293448,#151c27)}.avatar:after{content:attr(data-letter);position:absolute;inset:0;display:grid;place-items:center;color:#d5ddec;font-size:24px;font-weight:800}.avatar img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}.person b{display:block;margin-top:8px;font-size:13px}.person small{display:block;margin-top:2px;color:var(--muted2);font-size:10px}.assets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.asset{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0a0f15}.assetImg{aspect-ratio:16/10;position:relative;background:linear-gradient(145deg,#1b2431,#0d1218)}.assetImg:after{content:"媒体资产";position:absolute;inset:0;display:grid;place-items:center;color:#5e6b7d;font-size:11px}.assetImg img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}.asset span{display:block;padding:8px 9px;color:var(--muted);font-size:11px}.empty{padding:68px 20px;border:1px solid var(--line);border-radius:22px;background:#0d1219;color:var(--muted);text-align:center}.debug{margin-top:16px;border:1px solid var(--line);border-radius:15px;background:#090d12;padding:12px}.debug summary{cursor:pointer;color:#99a7ba;font-weight:700}.debug pre{max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#8390a4;font:11px/1.55 ui-monospace,Consolas,monospace}
@media(max-width:1100px){.trailers{grid-template-columns:1fr}.assets{grid-template-columns:repeat(3,1fr)}.heroIn{grid-template-columns:205px 1fr}.title{font-size:34px}}
@media(max-width:760px){.app{padding:14px 12px 36px}.top{align-items:flex-start;flex-direction:column}.candidates{grid-template-columns:1fr}.heroIn{grid-template-columns:1fr;padding:20px;align-items:start}.poster{width:180px}.title{font-size:30px}.metrics{display:grid;grid-template-columns:repeat(2,1fr)}.metric{min-width:0}.assets{grid-template-columns:repeat(2,1fr)}.search button{padding:0 16px}.trailer{grid-template-columns:100px 1fr}.cover{width:100px}.section{padding:15px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="mark"></div><div><b>影视数据实验室</b><span>实时 Provider · 高清媒体资产 · 字段溯源</span></div></div>
  <div class="live"><i></i>猫眼实时 · ACTIVE</div>
</header>

<div class="search"><input id="q" value="哪吒之魔童闹海" placeholder="输入电影名，例如：星际穿越"><button id="searchBtn" onclick="searchMovie()">实时搜索</button></div>
<div class="resultHead"><b>搜索结果</b><span id="searchMeta">等待搜索</span></div>
<div id="candidates" class="candidates"></div>
<main id="main"><div class="empty">正在初始化实时数据…</div></main>
<details class="debug"><summary>完整字段 / 来源 / 调试信息</summary><pre id="debug">等待请求…</pre></details>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const px=u=>u?('/api/media?url='+encodeURIComponent(u)):'';
const norm=s=>String(s||'').toLowerCase().replace(/[《》【】「」『』“”"'·—\-_:：，,。.!！?？()（）\s]/g,'');
let searchResults=[],activeId='',searchSeq=0,loadSeq=0,lastLog={},trailers=[],movieNow=null;

function log(k,v){lastLog[k]=v;$('#debug').textContent=JSON.stringify(lastLog,null,2)}
async function api(params,key){const t=performance.now(),r=await fetch('/api/maoyan?'+new URLSearchParams(params));let d;try{d=await r.json()}catch{throw new Error('接口返回异常')}d._client_ms=Math.round(performance.now()-t);log(key,d);if(!r.ok||!d.ok)throw new Error(d.error||('HTTP '+r.status));return d}
function scoreName(m,q){const n=norm(q),x=norm(m.name);if(x===n)return 0;if(x.startsWith(n))return 1;if(x.includes(n))return 2;return 9}
function rankResults(list,q){return [...list].sort((a,b)=>scoreName(a,q)-scoreName(b,q)||(Number(b.score)||0)-(Number(a.score)||0))}
function fmtNum(n){const x=Number(n);if(!Number.isFinite(x))return'—';if(x>=1e8)return(x/1e8).toFixed(2)+'亿';if(x>=1e4)return(x/1e4).toFixed(1)+'万';return x.toLocaleString('zh-CN')}
function img(url,eager=false){return url?`<img src="${esc(px(url))}" ${eager?'':'loading="lazy"'} onerror="this.remove()">`:''}
function safeName(n){return String(n||'').replace(/介绍$/,'').trim()}

function renderCandidates(){
  const box=$('#candidates');
  if(!searchResults.length){box.innerHTML='<div class="empty" style="grid-column:1/-1;padding:28px">没有找到匹配影片</div>';return}
  box.innerHTML=searchResults.slice(0,6).map((m,i)=>`<div class="candidate ${String(m.id)===activeId?'active':''}" onclick="loadMovie('${m.id}')"><div class="cposter">${img(m.poster)}</div><div><b>${esc(m.name)}</b><small>${esc([m.release_date,m.category,m.score>0?'猫眼 '+m.score:''].filter(Boolean).join(' · '))}</small>${i===0&&norm(m.name)===norm($('#q').value)?'<span class="exact">精确匹配</span>':''}</div></div>`).join('')
}

async function searchMovie(){
  const q=$('#q').value.trim();if(!q)return;
  const seq=++searchSeq;++loadSeq;activeId='';
  $('#searchBtn').disabled=true;$('#searchBtn').textContent='搜索中';$('#searchMeta').textContent='请求中…';
  $('#candidates').innerHTML='<div class="empty" style="grid-column:1/-1;padding:28px">正在实时搜索猫眼…</div>';
  $('#main').innerHTML='<div class="empty">等待搜索结果…</div>';
  try{
    const d=await api({action:'search',q},'search');if(seq!==searchSeq)return;
    searchResults=rankResults(d.movies||[],q);$('#searchMeta').textContent=`${searchResults.length} 条 · ${d.latency_ms}ms`;renderCandidates();
    if(searchResults[0])await loadMovie(searchResults[0].id);
  }catch(e){if(seq!==searchSeq)return;$('#searchMeta').textContent='搜索失败';$('#candidates').innerHTML=`<div class="empty" style="grid-column:1/-1;padding:28px">${esc(e.message)}</div>`}
  finally{if(seq===searchSeq){$('#searchBtn').disabled=false;$('#searchBtn').textContent='实时搜索'}}
}

function trailerPriority(v){const t=String(v.title||'');if(/首支预告|首曝预告|首支/.test(t))return 0;if(/正式预告|终极预告|定档预告/.test(t))return 1;if(/第二支预告|IMAX预告/.test(t))return 2;if(/番外|花絮|彩蛋|片段|幕后/.test(t))return 9;return 4}
function prepareTrailers(list){return (list||[]).filter(x=>x.type==='trailer'&&x.direct_media_url).sort((a,b)=>trailerPriority(a)-trailerPriority(b)||(b.play_count||0)-(a.play_count||0))}

function chooseTrailer(i){
  if(!trailers[i])return;
  document.querySelectorAll('.trailer').forEach((x,k)=>x.classList.toggle('active',k===i));
  const v=trailers[i],p=$('#playerWrap');if(!p)return;
  p.innerHTML=`<div class="player"><video controls playsinline preload="metadata" poster="${esc(px(v.cover||movieNow?.poster_hd||movieNow?.poster||''))}" src="${esc(v.direct_media_url||'')}"></video></div><div class="playerInfo"><div><b>${esc(v.title||'官方预告')}</b><br><span>${esc([v.duration,v.width&&v.height?`${v.width}×${v.height}`:'',v.play_count?fmtNum(v.play_count)+' 播放':''].filter(Boolean).join(' · '))}</span></div><span>猫眼官方视频</span></div>`
}

function personCard(a){const name=safeName(a.name)||'未知';const letter=name.slice(0,1)||'?';return `<div class="person"><div class="avatar" data-letter="${esc(letter)}">${img(a.avatar)}</div><b>${esc(name)}</b><small>person_id ${esc(a.id||'—')}</small></div>`}
function assetCard(url,label){return `<div class="asset"><div class="assetImg">${img(url)}</div><span>${esc(label)}</span></div>`}

async function loadMovie(id){
  const seq=++loadSeq;activeId=String(id);renderCandidates();$('#main').innerHTML='<div class="empty">正在加载影片详情与官方预告…</div>';
  try{
    const [d,v]=await Promise.all([api({action:'detail',id},'detail'),api({action:'videos',id},'videos')]);if(seq!==loadSeq)return;
    const m=d.movie||{};movieNow=m;trailers=prepareTrailers(v.videos||[]);
    let actors=(m.actors||[]).map(x=>({...x,name:safeName(x.name)}));
    if(actors.length){
      try{
        const p=await api({action:'people',ids:actors.map(x=>x.id).filter(Boolean).join(',')},'people');if(seq!==loadSeq)return;
        const map=new Map((p.people||[]).map(x=>[String(x.id),x]));
        actors=actors.map(a=>{const x=map.get(String(a.id));return x?{...a,...x,name:safeName(x.name)||a.name,avatar:x.avatar||a.avatar}:a});
      }catch(e){log('people_warning',{message:e.message})}
    }
    if(seq!==loadSeq)return;

    const poster=m.poster_hd||m.poster||searchResults.find(x=>String(x.id)===String(id))?.poster||'';
    const assets=[];if(poster)assets.push([poster,'高清海报']);trailers.slice(0,4).forEach((x,i)=>{if(x.cover)assets.push([x.cover,`预告封面 ${i+1}`])});
    const uniq=[],seen=new Set();for(const a of assets){if(a[0]&&!seen.has(a[0])){seen.add(a[0]);uniq.push(a)}}

    $('#main').innerHTML=`
      <section class="hero"><div class="heroBg" style="background-image:url('${esc(px(poster))}')"></div><div class="shade"></div><div class="heroIn"><div class="poster">${img(poster,true)}<span class="quality">高清海报</span></div><div><div class="source">MAOYAN · REALTIME</div><h1 class="title">${esc(m.name||'未命名')}</h1><div class="en">${esc(m.english_name||'')}</div><div class="chips">${[m.category,m.show_time,m.duration_min?m.duration_min+'分钟':''].filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><p class="desc">${esc(m.description||'暂无简介')}</p><div class="metrics"><div class="metric"><small>猫眼评分</small><strong>${m.score?esc(m.score):'—'}</strong><em>实时详情</em></div><div class="metric"><small>评分人数</small><strong>${m.score_count?fmtNum(m.score_count):'—'}</strong><em>实时解析</em></div><div class="metric"><small>片长</small><strong>${m.duration_min?m.duration_min+' 分钟':'—'}</strong><em>影片信息</em></div><div class="metric"><small>官方预告</small><strong>${trailers.length}</strong><em>可直接播放</em></div></div></div></div></section>
      ${trailers.length?`<section class="section"><div class="sectionHead"><h2>官方预告</h2><span>${trailers.length} 条 · 默认优先首支 / 正式预告</span></div><div class="trailers"><div id="playerWrap"></div><div class="playlist">${trailers.map((x,i)=>`<div class="trailer ${i===0?'active':''}" onclick="chooseTrailer(${i})"><div class="cover">${img(x.cover)}</div><div><b>${esc(x.title||('预告片 '+(i+1)))}</b><small>${esc([x.duration,x.play_count?fmtNum(x.play_count)+' 播放':''].filter(Boolean).join(' · '))}</small></div></div>`).join('')}</div></div></section>`:''}
      ${actors.length?`<section class="section"><div class="sectionHead"><h2>演职员</h2><span>人物页实时补头像 · 加载失败自动回退文字头像</span></div><div class="cast">${actors.map(personCard).join('')}</div></section>`:''}
      ${uniq.length?`<section class="section"><div class="sectionHead"><h2>高清媒体资产</h2><span>只展示当前真实拿到的媒体</span></div><div class="assets">${uniq.map(x=>assetCard(x[0],x[1])).join('')}</div></section>`:''}`;
    if(trailers.length)chooseTrailer(0);
  }catch(e){if(seq!==loadSeq)return;$('#main').innerHTML=`<div class="empty">详情加载失败：${esc(e.message)}</div>`}
}

$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')searchMovie()});
searchMovie();
</script>
</body>
</html>
