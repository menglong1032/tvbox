<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>影视数据实验室</title>
<style>
:root{--bg:#07090d;--panel:#0e131b;--panel2:#121925;--line:#222b39;--line2:#303c4f;--text:#f5f7fb;--muted:#8c99ad;--muted2:#657187;--good:#38d39f;--accent:#7c86ff;--accent2:#4aa8ff;--warn:#d9a73b;--r:22px}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font:14px/1.65 Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(1000px 520px at 15% -12%,#25396845,transparent 60%),var(--bg)}button,input{font:inherit}.app{max-width:1500px;margin:0 auto;padding:24px 28px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#9b8cff,#3e97ff);box-shadow:0 14px 38px #6576ff35}.brand b{display:block;font-size:18px;letter-spacing:.01em}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:1px}.providers{display:flex;gap:8px;flex-wrap:wrap}.provider{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#0c1118;color:var(--muted);font-size:12px}.provider.live{color:#ccefe4;border-color:#214c42}.dot{width:7px;height:7px;border-radius:50%;background:#5f6c81}.provider.live .dot{background:var(--good);box-shadow:0 0 0 4px #38d39f16}.search{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px;border:1px solid var(--line);border-radius:18px;background:#0d1219}.search input{height:50px;border:0;outline:0;background:transparent;color:#fff;padding:0 14px;font-size:16px}.search button{height:50px;border:0;border-radius:13px;background:#fff;color:#0a0c10;padding:0 24px;font-weight:800;cursor:pointer}.search button:disabled{opacity:.6;cursor:wait}.searchmeta{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 9px}.searchmeta h2{font-size:13px;margin:0}.searchmeta span{font-size:12px;color:var(--muted)}.candidates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}.candidate{display:grid;grid-template-columns:62px 1fr;gap:11px;align-items:center;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:15px;background:#0c1118;cursor:pointer;transition:.18s}.candidate:hover{border-color:#3b4960;background:#101722}.candidate.active{border-color:#5968a8;background:linear-gradient(135deg,#151d2d,#0f151f)}.candposter{width:62px;height:84px;border-radius:9px;overflow:hidden;background:linear-gradient(145deg,#1b2431,#0f141b);position:relative}.candposter:after{content:"无图";position:absolute;inset:0;display:grid;place-items:center;color:#5f6b7d;font-size:10px}.candposter img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}.candidate b{display:block;font-size:14px;line-height:1.35}.candidate small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}.match{display:inline-block;margin-top:6px;padding:2px 6px;border-radius:999px;background:#24324a;color:#b9ceff;font-size:10px}.hero{position:relative;border:1px solid var(--line);border-radius:28px;overflow:hidden;min-height:470px;background:#0c1118}.hero-bg{position:absolute;inset:-40px;background-position:center 25%;background-size:cover;filter:blur(38px) saturate(.8);opacity:.28;transform:scale(1.09)}.hero-layer{position:absolute;inset:0;background:linear-gradient(90deg,#080b10 0%,#090d13f2 35%,#090d13b6 66%,#090d13ef 100%),linear-gradient(0deg,#080a0e 0%,transparent 50%)}.hero-inner{position:relative;display:grid;grid-template-columns:250px minmax(0,1fr);gap:34px;min-height:470px;padding:32px;align-items:end}.posterbox{aspect-ratio:2/3;border-radius:18px;overflow:hidden;position:relative;background:linear-gradient(145deg,#1d2633,#0c1117);border:1px solid #ffffff17;box-shadow:0 22px 70px #000a}.posterbox:after{content:"海报加载中";position:absolute;inset:0;display:grid;place-items:center;color:#657187;font-size:12px}.posterbox img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}.quality{position:absolute;z-index:3;left:12px;bottom:12px;padding:5px 8px;border-radius:999px;background:#080b10d9;border:1px solid #ffffff25;color:#dce5f4;font-size:11px}.source{font-size:11px;letter-spacing:.13em;color:#91a1bb}.title{margin:7px 0 4px;font-size:42px;line-height:1.08;letter-spacing:-.035em}.en{color:#91a0b5}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.chip{padding:6px 9px;border:1px solid #ffffff17;border-radius:999px;background:#ffffff0d;color:#d6deeb;font-size:12px}.synopsis{max-width:850px;color:#cbd3df;font-size:14px;line-height:1.9;margin:13px 0 0}.metrics{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.metric{min-width:145px;padding:12px 14px;border:1px solid #ffffff13;border-radius:14px;background:#090d13b3;backdrop-filter:blur(12px)}.metric small{display:block;color:#8290a5}.metric strong{display:block;margin-top:2px;font-size:20px}.metric em{display:block;margin-top:1px;color:#647087;font-size:10px;font-style:normal}.section{margin-top:16px;padding:20px;border:1px solid var(--line);border-radius:23px;background:linear-gradient(180deg,#101620,#0b1017)}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}.sectionhead h2{font-size:18px;margin:0}.sectionhead span{color:var(--muted);font-size:12px}.trailers{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(340px,.8fr);gap:16px}.player{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#050608;border:1px solid var(--line)}.player video{width:100%;height:100%;display:block;background:#000}.playerinfo{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-top:10px}.playerinfo b{font-size:14px}.playerinfo span{color:var(--muted);font-size:12px}.playlist{display:grid;gap:8px;align-content:start}.traileritem{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:8px;border:1px solid var(--line);border-radius:13px;background:#0b1118;cursor:pointer;transition:.15s}.traileritem:hover,.traileritem.active{border-color:#4d5f7a;background:#121a26}.cover{width:118px;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:linear-gradient(145deg,#1b2431,#0e131b);position:relative}.cover:after{content:"预告";position:absolute;inset:0;display:grid;place-items:center;color:#607086;font-size:10px}.cover img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}.traileritem b{display:block;font-size:12px;line-height:1.45}.traileritem small{display:block;color:var(--muted);margin-top:4px}.cast{display:flex;gap:10px;overflow:auto;padding-bottom:4px}.person{flex:0 0 150px;padding:14px 10px;border:1px solid var(--line);border-radius:15px;background:#0b1017;text-align:center}.avatarbox{width:80px;height:80px;margin:0 auto;border-radius:50%;overflow:hidden;background:linear-gradient(145deg,#273246,#151c27);position:relative}.avatarbox:after{content:attr(data-letter);position:absolute;inset:0;display:grid;place-items:center;color:#d3dded;font-size:24px;font-weight:700}.avatarbox img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}.person b{display:block;margin-top:8px;font-size:13px}.person small{display:block;color:var(--muted2);font-size:10px;margin-top:2px}.assets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.asset{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0a0f15}.assetimg{aspect-ratio:16/10;position:relative;background:linear-gradient(145deg,#1b2431,#0d1218)}.assetimg:after{content:"媒体资产";position:absolute;inset:0;display:grid;place-items:center;color:#5e6b7d;font-size:11px}.assetimg img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}.asset span{display:block;padding:8px 9px;color:var(--muted);font-size:11px}.statusgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.statuscard{padding:13px;border:1px solid var(--line);border-radius:14px;background:#0b1017}.statuscard b{display:block}.statuscard span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.statuscard .ok{color:#79e1bd}.statuscard .pending{color:#d5b268}.debug{margin-top:16px;border:1px solid var(--line);border-radius:16px;background:#0a0e14;padding:13px}.debug summary{cursor:pointer;color:#a9b5c8;font-weight:700}.debug pre{white-space:pre-wrap;word-break:break-word;color:#8e9bb0;font:11px/1.55 ui-monospace,Consolas,monospace;max-height:360px;overflow:auto}.loading{padding:70px 20px;text-align:center;color:var(--muted);border:1px solid var(--line);border-radius:22px;background:#0d1219}.hidden{display:none!important}
@media(max-width:1100px){.trailers{grid-template-columns:1fr}.assets{grid-template-columns:repeat(3,1fr)}.hero-inner{grid-template-columns:200px 1fr}.title{font-size:34px}}
@media(max-width:760px){.app{padding:14px 12px 40px}.top{align-items:flex-start;flex-direction:column}.providers{width:100%}.candidates{grid-template-columns:1fr}.hero-inner{grid-template-columns:1fr;align-items:start;padding:20px}.posterbox{width:180px}.title{font-size:30px}.metrics{display:grid;grid-template-columns:repeat(2,1fr)}.metric{min-width:0}.assets{grid-template-columns:repeat(2,1fr)}.statusgrid{grid-template-columns:1fr}.section{padding:15px}.trailers{gap:12px}.traileritem{grid-template-columns:100px 1fr}.cover{width:100px}.search button{padding:0 16px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="brandmark"></div><div><b>影视数据实验室</b><span>实时抓取 · 媒体资产 · Provider 对照</span></div></div>
    <div class="providers"><div class="provider live"><i class="dot"></i>猫眼实时</div><div class="provider"><i class="dot"></i>灯塔待接</div><div class="provider"><i class="dot"></i>淘票票待接</div></div>
  </header>

  <div class="search"><input id="q" value="哪吒之魔童闹海" placeholder="输入电影名，例如：星际穿越"><button id="searchBtn" onclick="searchMovie()">实时搜索</button></div>
  <div class="searchmeta"><h2>匹配结果</h2><span id="searchMeta">等待搜索</span></div>
  <div id="candidates" class="candidates"></div>
  <main id="main"><div class="loading">正在初始化实时数据…</div></main>

  <section class="section">
    <div class="sectionhead"><h2>Provider 状态</h2><span>只展示当前真实接通情况</span></div>
    <div class="statusgrid">
      <div class="statuscard"><b>猫眼</b><span class="ok">ACTIVE · 搜索 / 详情 / 预告已接通</span></div>
      <div class="statuscard"><b>灯塔</b><span class="pending">待接入 · 登录态数据不伪造</span></div>
      <div class="statuscard"><b>淘票票</b><span class="pending">待接入 · 公开字段探测中</span></div>
    </div>
  </section>

  <details class="debug"><summary>完整字段 / 原始 Provider 返回</summary><pre id="debug">等待请求…</pre></details>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const px=u=>u?('/api/media?url='+encodeURIComponent(u)):'';
const norm=s=>String(s||'').toLowerCase().replace(/[《》【】「」『』“”"'·—\-_:：，,。.!！?？()（）\s]/g,'');
let searchResults=[],activeId='',searchSeq=0,loadSeq=0,lastLog={},trailers=[],movieNow=null;
function log(k,v){lastLog[k]=v;$('#debug').textContent=JSON.stringify(lastLog,null,2)}
async function api(params,key){const t=performance.now(),r=await fetch('/api/maoyan?'+new URLSearchParams(params));let d;try{d=await r.json()}catch{throw new Error('接口返回异常')}d._client_ms=Math.round(performance.now()-t);log(key,d);if(!r.ok||!d.ok)throw new Error(d.error||('HTTP '+r.status));return d}
function rankResults(list,q){const n=norm(q);return [...list].sort((a,b)=>score(a)-score(b));function score(m){const x=norm(m.name);if(x===n)return 0;if(x.startsWith(n))return 1;if(x.includes(n))return 2;return 9}}
function renderCandidates(){const box=$('#candidates');if(!searchResults.length){box.innerHTML='<div class="loading" style="grid-column:1/-1;padding:30px">没有找到匹配影片</div>';return}box.innerHTML=searchResults.slice(0,6).map((m,i)=>`<div class="candidate ${String(m.id)===activeId?'active':''}" onclick="loadMovie('${m.id}')"><div class="candposter">${m.poster?`<img src="${esc(px(m.poster))}" onerror="this.remove()">`:''}</div><div><b>${esc(m.name)}</b><small>${esc([m.release_date,m.category,m.score>0?'猫眼 '+m.score:''].filter(Boolean).join(' · '))}</small>${i===0&&norm(m.name)===norm($('#q').value)?'<span class="match">精确匹配</span>':''}</div></div>`).join('')}
async function searchMovie(){const q=$('#q').value.trim();if(!q)return;const seq=++searchSeq;++loadSeq;activeId='';$('#searchBtn').disabled=true;$('#searchBtn').textContent='搜索中';$('#searchMeta').textContent='请求中…';$('#candidates').innerHTML='<div class="loading" style="grid-column:1/-1;padding:28px">正在实时搜索猫眼…</div>';try{const d=await api({action:'search',q},'search');if(seq!==searchSeq)return;searchResults=rankResults(d.movies||[],q);$('#searchMeta').textContent=`${searchResults.length} 条 · ${d.latency_ms}ms`;renderCandidates();if(searchResults[0])await loadMovie(searchResults[0].id)}catch(e){if(seq!==searchSeq)return;$('#searchMeta').textContent='搜索失败';$('#candidates').innerHTML=`<div class="loading" style="grid-column:1/-1;padding:28px">${esc(e.message)}</div>`}finally{if(seq===searchSeq){$('#searchBtn').disabled=false;$('#searchBtn').textContent='实时搜索'}}}
function fmtNum(n){const x=Number(n);if(!Number.isFinite(x))return'—';if(x>=1e8)return(x/1e8).toFixed(2)+'亿';if(x>=1e4)return(x/1e4).toFixed(1)+'万';return x.toLocaleString('zh-CN')}
function img(url,cls=''){return url?`<img class="${cls}" src="${esc(px(url))}" onerror="this.remove()" loading="lazy">`:''}
function chooseTrailer(i){if(!trailers[i])return;document.querySelectorAll('.traileritem').forEach((x,k)=>x.classList.toggle('active',k===i));const v=trailers[i],p=$('#playerWrap');if(!p)return;p.innerHTML=`<div class="player"><video controls playsinline preload="metadata" poster="${esc(px(v.cover||movieNow?.poster_hd||movieNow?.poster||''))}" src="${esc(v.direct_media_url||'')}"></video></div><div class="playerinfo"><div><b>${esc(v.title||'官方预告')}</b><br><span>${esc([v.duration,v.width&&v.height?`${v.width}×${v.height}`:'',v.play_count?fmtNum(v.play_count)+' 播放':''].filter(Boolean).join(' · '))}</span></div><span>猫眼预告片</span></div>`}
function personCard(a){const letter=(a.name||'?').slice(0,1);return `<div class="person"><div class="avatarbox" data-letter="${esc(letter)}">${a.avatar?img(a.avatar):''}</div><b>${esc(a.name||'未知')}</b><small>person_id ${esc(a.id||'—')}</small></div>`}
function assetCard(url,label){return `<div class="asset"><div class="assetimg">${img(url)}</div><span>${esc(label)}</span></div>`}
async function loadMovie(id){const seq=++loadSeq;activeId=String(id);renderCandidates();$('#main').innerHTML='<div class="loading">正在加载影片详情与真实预告…</div>';try{const [d,v]=await Promise.all([api({action:'detail',id},'detail'),api({action:'videos',id},'videos')]);if(seq!==loadSeq)return;const m=d.movie||{};movieNow=m;trailers=(v.videos||[]).filter(x=>x.type==='trailer'&&x.direct_media_url);const poster=m.poster_hd||m.poster||'';const actors=(m.actors||[]);const assets=[];if(poster)assets.push([poster,'高清海报']);trailers.slice(0,4).forEach((x,i)=>{if(x.cover)assets.push([x.cover,`预告封面 ${i+1}`])});const uniq=[];const seen=new Set();for(const a of assets){if(!seen.has(a[0])){seen.add(a[0]);uniq.push(a)}}
$('#main').innerHTML=`
<section class="hero"><div class="hero-bg" style="background-image:url('${esc(px(poster))}')"></div><div class="hero-layer"></div><div class="hero-inner"><div class="posterbox">${img(poster)}<span class="quality">高清原图</span></div><div><div class="source">MAOYAN · REALTIME</div><h1 class="title">${esc(m.name||'未命名')}</h1><div class="en">${esc(m.english_name||'')}</div><div class="chips">${[m.category,m.show_time,m.duration_min?m.duration_min+'分钟':''].filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><p class="synopsis">${esc(m.description||'暂无简介')}</p><div class="metrics"><div class="metric"><small>猫眼评分</small><strong>${m.score?esc(m.score):'—'}</strong><em>公开详情页</em></div><div class="metric"><small>评分人数</small><strong>${m.score_count?fmtNum(m.score_count):'—'}</strong><em>实时解析</em></div><div class="metric"><small>片长</small><strong>${m.duration_min?m.duration_min+' 分钟':'—'}</strong><em>影片信息</em></div><div class="metric"><small>预告片</small><strong>${trailers.length}</strong><em>可直接播放</em></div></div></div></div></section>
${trailers.length?`<section class="section"><div class="sectionhead"><h2>官方预告</h2><span>${trailers.length} 条 · 来自猫眼公开 videoList.feeds</span></div><div class="trailers"><div id="playerWrap"></div><div class="playlist">${trailers.map((x,i)=>`<div class="traileritem ${i===0?'active':''}" onclick="chooseTrailer(${i})"><div class="cover">${img(x.cover)}</div><div><b>${esc(x.title||('预告片 '+(i+1)))}</b><small>${esc([x.duration,x.play_count?fmtNum(x.play_count)+' 播放':''].filter(Boolean).join(' · '))}</small></div></div>`).join('')}</div></div></section>`:''}
${actors.length?`<section class="section"><div class="sectionhead"><h2>演职员</h2><span>头像缺失时使用干净占位，不显示裂图</span></div><div class="cast">${actors.map(personCard).join('')}</div></section>`:''}
${uniq.length?`<section class="section"><div class="sectionhead"><h2>高清媒体资产</h2><span>只展示当前确实拿到的资源</span></div><div class="assets">${uniq.map(x=>assetCard(x[0],x[1])).join('')}</div></section>`:''}`;
if(trailers.length)chooseTrailer(0)}catch(e){if(seq!==loadSeq)return;$('#main').innerHTML=`<div class="loading">详情加载失败：${esc(e.message)}</div>`}}
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')searchMovie()});searchMovie();
</script>
</body>
</html>
